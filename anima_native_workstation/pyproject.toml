[project]
name = "anima-midi-production-engine"
version = "1.1.0"
description = "Completely offline native workstation for the ANIMA MIDI engines"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "mido>=1.3,<2",
]

[project.scripts]
anima-native = "main:main"

[tool.pyright]
pythonVersion = "3.11"
include = ["."]
exclude = [".venv", "build", "dist"]
